            .lightbox.active {

            @keyframes lb-fadein {

            /* ── Imagen y caption ── */

                display: flex;
                flex-direction: column;

            #lightbox-caption {

        <!-- SCRIPT DEL LIGHTBOX -->
        <script>
        (function () {
            // Recolectar todas las figuras de la galería
            const figures = Array.from(document.querySelectorAll('.gallery-grid figure'));
            let currentIndex = 0;

            const lightbox  = document.getElementById('lightbox');
            const lbImg     = document.getElementById('lightbox-img');
            const lbCaption = document.getElementById('lightbox-caption');
            const lbCounter = document.getElementById('lightbox-counter');
            const btnClose  = document.getElementById('lightbox-close');
            const btnPrev   = document.getElementById('lightbox-prev');
            const btnNext   = document.getElementById('lightbox-next');

            // ── Abrir lightbox ──
            function openLightbox(index) {
                currentIndex = index;
                showImage(currentIndex);
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
                lightbox.focus();
            }

            // ── Cerrar lightbox ──
            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }

            // ── Mostrar imagen según índice ──
            function showImage(index) {
                const fig = figures[index];
                const img = fig.querySelector('img');
                const cap = fig.querySelector('figcaption');
                lbImg.src = img.src;
                lbImg.alt = img.alt;
                lbCaption.textContent = cap ? cap.textContent : '';
                lbCounter.textContent = (index + 1) + ' / ' + figures.length;
                // Re-trigger animation
                lbImg.style.animation = 'none';
                lbImg.offsetHeight; // reflow
                lbImg.style.animation = '';
            }

            // ── Navegar ──
            function prevImage() {
                currentIndex = (currentIndex - 1 + figures.length) % figures.length;
                showImage(currentIndex);
            }
            function nextImage() {
                currentIndex = (currentIndex + 1) % figures.length;
                showImage(currentIndex);
            }

            // ── Click en cada figura ──
            figures.forEach(function (fig, i) {
                fig.addEventListener('click', function () { openLightbox(i); });
            });

            // ── Botones ──
            btnClose.addEventListener('click', closeLightbox);
            btnPrev.addEventListener('click', prevImage);
            btnNext.addEventListener('click', nextImage);

            // ── Click fuera de la imagen ──
            lightbox.addEventListener('click', function (e) {
                if (e.target === lightbox) closeLightbox();
            });

            // ── Teclado (flechas + Escape) ──
            document.addEventListener('keydown', function (e) {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'ArrowLeft')  prevImage();
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'Escape')     closeLightbox();
            });

            // ── Swipe táctil ──
            let touchStartX = 0;
            let touchStartY = 0;

            lightbox.addEventListener('touchstart', function (e) {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });

            lightbox.addEventListener('touchend', function (e) {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                // Solo considerar swipe horizontal si no fue principalmente vertical
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                    if (dx < 0) nextImage();
                    else        prevImage();
                }
            }, { passive: true });
        })();
        </script>

            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
